{% extends "base.html" %}

{% block title %}
  GRUMBLER - 設定
{% endblock %}

{% block content %}
<div class="settings-header">
  <h1 class="settings-title">設定</h1>
  <p class="settings-subtitle">プロフィール情報を変更できます</p>
</div>

<form method="POST" action="{{ url_for('user.settings') }}">
  <div class="settings-card">
    <div class="form-group">
      <label class="form-label" for="username">ユーザー名</label>
      <input class="form-input" type="text" id="username" name="username"
             value="{{ session.get('name', '') }}" placeholder="ユーザー名を入力" required>
      <p class="form-hint">他のユーザーに表示される名前です</p>
    </div>

    <div class="form-group">
      <label class="form-label" for="email">メールアドレス</label>
      <input class="form-input" type="email" id="email" name="email"
             value="{{ session.get('email', '') }}" placeholder="example@mail.com">
      <p class="form-hint">通知の送信先として使用されます（任意）</p>
    </div>
  </div>

  <div class="settings-footer">
    <button class="btn-save" type="submit">保存する</button>
  </div>
</form>
{% endblock %}
