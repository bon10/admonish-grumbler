{% extends "base.html" %}

{% block title %}
  GRUMBLER - ダッシュボード
{% endblock %}

{% block content %}
<div class="dashboard">
  <div class="settings-header">
    <h1 class="settings-title">ダッシュボード</h1>
    <p class="settings-subtitle">スコア推移を確認できます</p>
  </div>

  <!-- Tab Switch -->
  <div class="dashboard-tabs">
    <button class="dashboard-tab is-active" data-type="weekly">週次</button>
    <button class="dashboard-tab" data-type="monthly">月次</button>
  </div>

  <!-- Latest Scores -->
  <div id="dashboard-scores" class="summary-score-section" style="display: none;">
    <div class="score-card">
      <div class="score-card-label">ストレスレベル</div>
      <div class="score-ring-wrapper">
        <svg class="score-ring" viewBox="0 0 120 120">
          <circle class="score-ring-bg" cx="60" cy="60" r="50" />
          <circle class="score-ring-fill score-ring-stress" cx="60" cy="60" r="50" id="ring-stress"
            stroke-dasharray="0 314.16" />
        </svg>
        <div class="score-ring-value" id="val-stress">-</div>
      </div>
    </div>
    <div class="score-card">
      <div class="score-card-label">幸福度</div>
      <div class="score-ring-wrapper">
        <svg class="score-ring" viewBox="0 0 120 120">
          <circle class="score-ring-bg" cx="60" cy="60" r="50" />
          <circle class="score-ring-fill score-ring-happiness" cx="60" cy="60" r="50" id="ring-happiness"
            stroke-dasharray="0 314.16" />
        </svg>
        <div class="score-ring-value" id="val-happiness">-</div>
      </div>
    </div>
    <div class="score-card">
      <div class="score-card-label">感情スコア</div>
      <div class="score-sentiment-display">
        <span class="score-sentiment-value" id="val-sentiment">-</span>
        <span class="score-sentiment-range">-1.0 〜 1.0</span>
      </div>
    </div>
  </div>

  <div id="dashboard-meta" class="dashboard-meta" style="display: none;">
    <span id="meta-emoji"></span>
    <span id="meta-period"></span>
    <span id="meta-posts"></span>
  </div>

  <!-- Trend Chart -->
  <div id="dashboard-chart-section" class="summary-section" style="display: none;">
    <h2 class="summary-section-title"><i class="fas fa-chart-line"></i> スコア推移</h2>
    <div class="chart-container dashboard-chart-container">
      <canvas id="dashboardChart"></canvas>
    </div>
  </div>

  <!-- Empty State -->
  <div id="dashboard-empty" class="summary-empty" style="display: none;">
    <div class="summary-empty-icon"><i class="fas fa-chart-bar"></i></div>
    <p>まだサマリーがありません</p>
    <p class="summary-empty-hint">サマリーを生成するとここにスコアの推移が表示されます</p>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js"></script>
<script>
  let chart = null;

  function updateDashboard(type) {
    fetch('/dashboard/data?type=' + type)
      .then(r => r.json())
      .then(data => {
        const hasData = data.labels && data.labels.length > 0;

        document.getElementById('dashboard-scores').style.display = hasData ? '' : 'none';
        document.getElementById('dashboard-meta').style.display = hasData ? '' : 'none';
        document.getElementById('dashboard-chart-section').style.display = (hasData && data.labels.length > 1) ? '' : 'none';
        document.getElementById('dashboard-empty').style.display = hasData ? 'none' : '';

        if (!hasData) return;

        // Update score rings
        const latest = data.latest;
        const circumference = 314.16;

        document.getElementById('val-stress').textContent = latest.stress_score;
        document.getElementById('ring-stress').setAttribute(
          'stroke-dasharray', (latest.stress_score / 100 * circumference) + ' ' + circumference
        );

        document.getElementById('val-happiness').textContent = latest.happiness_score;
        document.getElementById('ring-happiness').setAttribute(
          'stroke-dasharray', (latest.happiness_score / 100 * circumference) + ' ' + circumference
        );

        const sentimentEl = document.getElementById('val-sentiment');
        sentimentEl.textContent = latest.sentiment_score.toFixed(1);
        sentimentEl.className = 'score-sentiment-value ' + (latest.sentiment_score >= 0 ? 'is-positive' : 'is-negative');

        // Update meta
        document.getElementById('meta-emoji').textContent = latest.emoji_expression || '';
        document.getElementById('meta-period').textContent = latest.period_label;
        document.getElementById('meta-posts').textContent = latest.post_count + '件の投稿';

        // Update chart
        if (data.labels.length > 1) {
          const sentimentNormalized = data.sentiment.map(v => (v * 50) + 50);

          if (chart) {
            chart.data.labels = data.labels;
            chart.data.datasets[0].data = data.stress;
            chart.data.datasets[1].data = data.happiness;
            chart.data.datasets[2].data = sentimentNormalized;
            chart.update();
          } else {
            const ctx = document.getElementById('dashboardChart').getContext('2d');
            chart = new Chart(ctx, {
              type: 'line',
              data: {
                labels: data.labels,
                datasets: [
                  {
                    label: 'ストレス',
                    data: data.stress,
                    borderColor: '#EF4444',
                    backgroundColor: 'rgba(239, 68, 68, 0.1)',
                    tension: 0.3,
                    fill: false,
                    pointRadius: 4,
                    pointHoverRadius: 6,
                  },
                  {
                    label: '幸福度',
                    data: data.happiness,
                    borderColor: '#22C55E',
                    backgroundColor: 'rgba(34, 197, 94, 0.1)',
                    tension: 0.3,
                    fill: false,
                    pointRadius: 4,
                    pointHoverRadius: 6,
                  },
                  {
                    label: '感情 (正規化)',
                    data: sentimentNormalized,
                    borderColor: '#F97316',
                    backgroundColor: 'rgba(249, 115, 22, 0.1)',
                    tension: 0.3,
                    fill: false,
                    pointRadius: 4,
                    pointHoverRadius: 6,
                    borderDash: [5, 5],
                  }
                ]
              },
              options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                  legend: {
                    labels: {
                      color: '#8A8A96',
                      font: { family: 'Outfit' }
                    }
                  },
                  tooltip: {
                    callbacks: {
                      label: function(context) {
                        if (context.datasetIndex === 2) {
                          const original = data.sentiment[context.dataIndex];
                          return context.dataset.label + ': ' + original.toFixed(1);
                        }
                        return context.dataset.label + ': ' + context.parsed.y;
                      }
                    }
                  }
                },
                scales: {
                  x: {
                    ticks: { color: '#55555F' },
                    grid: { color: 'rgba(44, 44, 51, 0.5)' }
                  },
                  y: {
                    min: 0,
                    max: 100,
                    ticks: { color: '#55555F' },
                    grid: { color: 'rgba(44, 44, 51, 0.5)' }
                  }
                }
              }
            });
          }

          // Store sentiment raw data for tooltip
          chart._sentimentRaw = data.sentiment;
        }
      });
  }

  // Tab switching
  document.querySelectorAll('.dashboard-tab').forEach(tab => {
    tab.addEventListener('click', function() {
      document.querySelectorAll('.dashboard-tab').forEach(t => t.classList.remove('is-active'));
      this.classList.add('is-active');
      updateDashboard(this.dataset.type);
    });
  });

  // Initial load
  updateDashboard('weekly');
</script>
{% endblock %}
